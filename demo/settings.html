<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><nav class="site-nav fade-in"><a href="index.html">~</a><a href="terminal.html">terminal</a><a href="discovery.html">discovery</a><a href="alerts.html">alerts</a><a href="plugins.html">plugins</a><a href="widgets.html">widgets</a><a href="settings.html" class="active">settings</a><a href="login.html" class="danger">exit</a></nav></header>
<main>
<div class="card fade-in delay-1" style="max-width:380px">
<input type="password" id="currentPassword" placeholder="Current password">
<input type="password" id="newPassword" placeholder="New password">
<input type="password" id="confirmPassword" placeholder="Confirm">
<button class="button1" id="changePasswordBtn">Change</button>
<p id="passwordStatus" class="status-message"></p></div>
<div class="card fade-in delay-2">
<div id="2faStatus" style="margin-bottom:10px" class="mono muted"></div>
<div id="2faSetup" style="display:none"><img id="qrCode" style="border:1px solid var(--line);background:white;padding:8px;max-width:160px">
<p class="mono muted" style="font-size:11px;margin:8px 0"><code id="manualCode" style="background:var(--bg);padding:2px 6px;border:1px solid var(--line)"></code></p>
<div style="display:flex;gap:8px;margin-top:4px"><input type="text" id="totpCode" placeholder="000000" maxlength="6" style="width:130px"><button class="button1" id="verify2faBtn">Verify</button></div>
<p id="2faStatus2" class="status-message"></p></div>
<button class="button2 danger" id="disable2faBtn" style="display:none">Disable 2FA</button></div>
<div class="card fade-in delay-3"><button class="button2" id="refreshSessions">Refresh</button>
<div id="sessionsList" class="mono" style="color:var(--dim);font-size:12px;margin-top:8px">Loading…</div></div>
</main>
<script src="js/demo-mock.js"></script><script src="js/site.js"></script><script src="js/settings.js"></script></body></html>
