<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><nav class="site-nav fade-in"><a href="index.html">~</a><a href="terminal.html">terminal</a><a href="discovery.html">discovery</a><a href="alerts.html">alerts</a><a href="plugins.html">plugins</a><a href="widgets.html">widgets</a><a href="settings.html">settings</a><a href="login.html" class="danger">exit</a></nav></header>
<main>
<div class="card fade-in delay-1"><div id="deviceDetails">
<p id="deviceName" class="mono" style="font-weight:600;font-size:13px"></p>
<p id="deviceIP" class="mono" style="color:var(--dim);font-size:11px;margin-top:4px"></p>
<p id="deviceType" class="mono" style="color:var(--dim);font-size:11px"></p>
<div id="deviceActions" style="display:flex;gap:10px;margin-top:12px"><button class="button1" id="pingBtn">Ping</button><button class="button2" id="backButton">←</button></div>
</div></div>
<div class="card fade-in delay-2" id="statsCard" style="display:none"><p id="statUptime" class="mono" style="color:var(--dim);font-size:12px"></p><p id="statLatency" class="mono" style="color:var(--dim);font-size:12px"></p><p id="statStatus" class="mono" style="color:var(--dim);font-size:12px"></p></div>
<div class="card fade-in delay-2" id="historyCard" style="display:none"><canvas id="historyChart" width="380" height="150"></canvas></div>
<div class="card fade-in delay-3" id="snmpCard" style="display:none"><div id="snmpInterfaces" style="overflow-x:auto"></div></div>
</main>
<script src="js/demo-mock.js"></script><script src="js/site.js"></script><script src="js/device_page.js"></script></body></html>
