<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><nav class="site-nav fade-in"><a href="index.html">~</a><a href="terminal.html">terminal</a><a href="discovery.html">discovery</a><a href="alerts.html" class="active">alerts</a><a href="plugins.html">plugins</a><a href="widgets.html">widgets</a><a href="settings.html">settings</a><a href="login.html" class="danger">exit</a></nav></header>
<main>
<div class="card fade-in delay-1"><div class="form-row">
<div class="form-group small"><select id="channelType"><option value="webhook">Webhook</option><option value="discord">Discord</option><option value="telegram">Telegram</option><option value="email">Email</option></select></div>
<div class="form-group"><input type="text" id="channelName" placeholder="Name"></div>
<div id="channelFields" style="flex:2;min-width:200px;display:flex;gap:8px;flex-wrap:wrap"></div>
<div class="form-group small"><button class="button1" id="addChannelBtn" style="width:100%">+</button></div>
</div></div>
<div class="card fade-in delay-2"><div id="channelsList" class="mono muted" style="font-size:12px">Loading…</div></div>
<div class="card fade-in delay-2"><div id="alertLog" class="mono muted" style="max-height:360px;overflow-y:auto;font-size:11px">Loading…</div></div>
<div class="card fade-in delay-3"><div class="form-row">
<div class="form-group small"><select id="maintDevice"></select></div>
<div class="form-group"><input type="datetime-local" id="maintStart"></div>
<div class="form-group"><input type="datetime-local" id="maintEnd"></div>
<div class="form-group"><input type="text" id="maintNote" placeholder="Note"></div>
<div class="form-group small"><button class="button1" id="addMaintBtn" style="width:100%">+</button></div>
</div><div id="maintList" class="mono muted" style="margin-top:10px;font-size:11px"></div></div>
</main>
<script src="js/demo-mock.js"></script><script src="js/site.js"></script><script src="js/alerts.js"></script></body></html>
