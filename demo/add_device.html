<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><nav class="site-nav fade-in"><a href="index.html">~</a><a href="terminal.html">terminal</a><a href="discovery.html">discovery</a><a href="alerts.html">alerts</a><a href="plugins.html">plugins</a><a href="widgets.html">widgets</a><a href="settings.html">settings</a><a href="login.html" class="danger">exit</a></nav></header>
<main><div class="card card-accent fade-in delay-1" id="addDeviceForm">
<div class="form-group"><input type="text" id="deviceName" placeholder="Name"></div>
<div class="form-group"><input type="text" id="deviceIP" placeholder="IP / Hostname"></div>
<div class="form-group small"><select id="deviceType"><option value="router">Router</option><option value="switch">Switch</option><option value="server">Server</option><option value="camera">Camera</option><option value="pc">PC</option><option value="printer">Printer</option></select></div>
<div class="form-group small"><select id="checkType"><option value="ping">Ping</option><option value="http">HTTP</option><option value="tcp">TCP</option></select></div>
<div class="form-group small" id="portWrap" style="display:none"><input type="number" id="devicePort" placeholder="Port" min="1" max="65535"></div>
<div class="form-group small" id="pathWrap" style="display:none"><input type="text" id="httpPath" placeholder="/health"></div>
<div class="form-group small" id="httpsWrap" style="display:none"><label class="checkbox-label"><input type="checkbox" id="useHttps"> HTTPS</label></div>
<div class="form-group"><input type="text" id="deviceNotes" placeholder="Notes"></div>
<div class="form-group" style="flex:0 1 100%"><label class="checkbox-label"><input type="checkbox" id="snmpEnabled"> SNMP</label><input type="text" id="snmpCommunity" placeholder="Community" style="display:none;margin-top:8px"></div>
<div class="form-group small"><button class="button2" id="pingIp" style="width:100%">Test</button></div>
<div style="display:flex;gap:10px;margin-top:14px"><button class="button2" onclick="location.href='index.html'">←</button><button class="button1" id="addDeviceButton">Add</button></div>
<p id="statusMessage" class="status-message"></p></div></main>
<script src="js/demo-mock.js"></script><script src="js/site.js"></script><script src="js/add_device.js"></script></body></html>
