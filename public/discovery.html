<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Discovery — BEACON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-mark">◉</div>
            <div class="brand-text">
                <div class="brand-name">BEACON</div>
                <div class="brand-sub">Network Discovery</div>
            </div>
        </div>
        <nav class="topnav">
            <a href="index.html">Dashboard</a>
            <a href="terminal.html">Terminal</a>
            <a href="discovery.html">Discovery</a>
            <a href="alerts.html">Alerts</a>
            <a href="plugins.html">Plugins</a>
            <a href="widgets.html">Widgets</a>
            <a href="settings.html">Settings</a>
            <button class="button2 danger" id="logoutBtn">Logout</button>
        </nav>
    </header>
    <main>
        <div class="card card-accent">
            <div class="section-title">Scan Network</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Subnet</label>
                    <select id="subnetSelect">
                        <option value="">Loading…</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Or enter CIDR manually</label>
                    <input type="text" id="cidrInput" placeholder="192.168.1.0/24">
                </div>
                <div class="form-group small">
                    <button class="button1" id="scanBtn" style="width:100%">Start Scan</button>
                </div>
            </div>
            <div id="scanProgress" style="display:none;margin-top:14px;">
                <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-dim);margin-bottom:6px;" class="mono">
                    <span id="progressText">Scanning…</span>
                    <span id="progressCount">0/0</span>
                </div>
                <div class="progress-track"><div id="progressBar" class="progress-fill" style="width:0%"></div></div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Discovered Devices</div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="button1" id="adoptBtn">Adopt Selected</button>
                <button class="button2" id="ignoreBtn">Ignore Selected</button>
                <span id="selectedCount" class="mono" style="font-size:10px;color:var(--ink-dim);align-self:center;"></span>
            </div>
            <div id="resultsTable" class="mono" style="color:var(--ink-dim);font-size:12px">No scan results yet.</div>
        </div>

        <div id="adoptDialog" class="dialog-overlay">
            <div class="dialog">
                <div class="section-title">Adopt Device</div>
                <input type="hidden" id="adoptIp">
                <div style="margin-bottom:10px;">
                    <label class="field-label">Name</label>
                    <input type="text" id="adoptName" placeholder="My Device">
                </div>
                <div style="margin-bottom:14px;">
                    <label class="field-label">Type</label>
                    <select id="adoptType">
                        <option value="router">Router</option>
                        <option value="switch">Switch</option>
                        <option value="server">Server</option>
                        <option value="camera">Camera</option>
                        <option value="pc">PC</option>
                        <option value="printer">Printer</option>
                    </select>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="button1" id="adoptConfirmBtn">Adopt</button>
                    <button class="button2" id="adoptCancelBtn">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', () => { document.cookie = 'dashboard_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'; location.reload(); });

        (async () => {
            const res = await fetch('/api/discovery/subnets', { credentials: 'include' });
            const subnets = await res.json();
            const sel = document.getElementById('subnetSelect');
            sel.innerHTML = subnets.length
                ? subnets.map((s) => `<option value="${s.cidr}">${s.cidr} (${s.iface})</option>`).join('')
                : '<option value="">No subnets found</option>';
        })();

        let scanning = false;
        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (scanning) return;
            const cidr = document.getElementById('cidrInput').value.trim() || document.getElementById('subnetSelect').value;
            if (!cidr) return alert('Select or enter a subnet');

            scanning = true;
            document.getElementById('scanBtn').textContent = 'Scanning…';
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanProgress').style.display = '';

            const res = await fetch('/api/discovery/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cidr }),
                credentials: 'include',
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.error || 'Scan failed');
                resetScan();
                return;
            }
        });

        function resetScan() {
            scanning = false;
            document.getElementById('scanBtn').textContent = 'Start Scan';
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('scanProgress').style.display = 'none';
            document.getElementById('progressBar').style.width = '0%';
        }

        try {
            const socket = io();
            socket.on('discovery:progress', ({ checked, total }) => {
                const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
                document.getElementById('progressBar').style.width = pct + '%';
                document.getElementById('progressText').textContent = `Scanning… ${pct}%`;
                document.getElementById('progressCount').textContent = `${checked}/${total}`;
            });
            socket.on('discovery:done', ({ foundCount }) => {
                resetScan();
                document.getElementById('progressText').textContent = `Done — found ${foundCount} device(s)`;
                loadResults();
            });
            socket.on('discovery:found', () => {});
        } catch {}

        let allResults = [];
        async function loadResults() {
            const res = await fetch('/api/discovery/results?status=new', { credentials: 'include' });
            allResults = await res.json();
            renderResults();
        }

        function renderResults() {
            const div = document.getElementById('resultsTable');
            if (!allResults.length) { div.textContent = 'No new devices found.'; return; }
            div.innerHTML = `
                <table class="data-table">
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>IP</th>
                        <th>MAC</th>
                        <th>Vendor</th>
                        <th>SNMP</th>
                        <th>Action</th>
                    </tr>
                    ${allResults.map((r) => `
                        <tr>
                            <td><input type="checkbox" class="result-check" data-id="${r.id}"></td>
                            <td>${r.ip}</td>
                            <td style="font-size:10px;color:var(--ink-dim);">${r.mac || '—'}</td>
                            <td>${r.vendor_guess || '—'}</td>
                            <td style="font-size:11px;">${r.snmp_sysdescr ? r.snmp_sysdescr.substring(0, 40) : '—'}</td>
                            <td>
                                <button class="button1" style="padding:4px 10px;font-size:10px;" onclick="openAdopt('${r.ip}', '${r.vendor_guess || ''}')">Adopt</button>
                            </td>
                        </tr>
                    `).join('')}
                </table>
            `;
            document.getElementById('selectAll').addEventListener('change', (e) => {
                document.querySelectorAll('.result-check').forEach((cb) => { cb.checked = e.target.checked; });
                updateSelectedCount();
            });
            document.querySelectorAll('.result-check').forEach((cb) => {
                cb.addEventListener('change', updateSelectedCount);
            });
        }

        function updateSelectedCount() {
            const count = document.querySelectorAll('.result-check:checked').length;
            document.getElementById('selectedCount').textContent = count ? `${count} selected` : '';
        }

        window.openAdopt = (ip, vendorGuess) => {
            document.getElementById('adoptIp').value = ip;
            document.getElementById('adoptName').value = vendorGuess ? `${vendorGuess} (${ip})` : '';
            document.getElementById('adoptDialog').classList.add('open');
            document.getElementById('adoptDialog').style.display = 'flex';
        };
        document.getElementById('adoptCancelBtn').addEventListener('click', () => {
            document.getElementById('adoptDialog').classList.remove('open');
            document.getElementById('adoptDialog').style.display = 'none';
        });
        document.getElementById('adoptConfirmBtn').addEventListener('click', async () => {
            const ip = document.getElementById('adoptIp').value;
            const name = document.getElementById('adoptName').value.trim();
            const type = document.getElementById('adoptType').value;
            if (!name) return alert('Enter a name');
            const disc = allResults.find((r) => r.ip === ip);
            const discoveredId = disc ? disc.id : null;
            const res = await fetch('/api/discovery/adopt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ discoveredId, name, type }),
                credentials: 'include',
            });
            if (res.ok) {
                document.getElementById('adoptDialog').style.display = 'none';
                document.getElementById('adoptDialog').classList.remove('open');
                loadResults();
            } else {
                const err = await res.json();
                alert(err.error || 'Failed');
            }
        });

        document.getElementById('adoptBtn').addEventListener('click', async () => {
            const checked = document.querySelectorAll('.result-check:checked');
            if (!checked.length) return alert('Select devices first');
            for (const cb of checked) {
                const id = parseInt(cb.dataset.id);
                const disc = allResults.find((r) => r.id === id);
                if (!disc) continue;
                await fetch('/api/discovery/adopt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discoveredId: id, name: disc.vendor_guess || disc.ip, type: 'router' }),
                    credentials: 'include',
                });
            }
            loadResults();
        });

        document.getElementById('ignoreBtn').addEventListener('click', async () => {
            const checked = document.querySelectorAll('.result-check:checked');
            if (!checked.length) return;
            for (const cb of checked) {
                const id = parseInt(cb.dataset.id);
                await fetch('/api/discovery/ignore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ discoveredId: id }),
                    credentials: 'include',
                });
            }
            loadResults();
        });

        loadResults();
    </script>
</body>
</html>
