<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><span class="brand-name">BEACON</span>
<nav class="topnav"><a href="index.html">Dashboard</a><a href="terminal.html">Terminal</a><a href="discovery.html">Discovery</a><a href="alerts.html">Alerts</a><a href="plugins.html">Plugins</a><a href="widgets.html">Widgets</a><a href="settings.html">Settings</a><button class="button2 danger" id="logoutBtn">Logout</button></nav></header>
<main>
<div class="card"><div class="form-row">
<div class="form-group"><select id="subnetSelect"><option value="">Loading…</option></select></div>
<div class="form-group"><input type="text" id="cidrInput" placeholder="192.168.1.0/24"></div>
<div class="form-group small"><button class="button1" id="scanBtn" style="width:100%">Scan</button></div></div>
<div id="scanProgress" style="display:none;margin-top:14px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:6px" class="mono"><span id="progressText">Scanning…</span><span id="progressCount">0/0</span></div><div class="progress-track"><div id="progressBar" class="progress-fill" style="width:0%"></div></div></div></div>
<div class="card"><div style="display:flex;gap:8px;margin-bottom:12px"><button class="button1" id="adoptBtn">Adopt</button><button class="button2" id="ignoreBtn">Ignore</button><span id="selectedCount" class="mono" style="font-size:10px;color:var(--dim);align-self:center"></span></div>
<div id="resultsTable" class="mono" style="color:var(--dim);font-size:12px">No scan results.</div></div>
<div id="adoptDialog" class="dialog-overlay"><div class="dialog">
<input type="hidden" id="adoptIp"><div style="margin-bottom:10px"><input type="text" id="adoptName" placeholder="Name"></div>
<div style="margin-bottom:14px"><select id="adoptType"><option value="router">Router</option><option value="switch">Switch</option><option value="server">Server</option><option value="camera">Camera</option><option value="pc">PC</option><option value="printer">Printer</option></select></div>
<div style="display:flex;gap:8px"><button class="button1" id="adoptConfirmBtn">Adopt</button><button class="button2" id="adoptCancelBtn">Cancel</button></div></div></div>
</main>
<script src="/socket.io/socket.io.js"></script><script src="js/site.js"></script><script src="js/discovery.js"></script></body></html>
