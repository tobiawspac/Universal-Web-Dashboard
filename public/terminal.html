<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Terminal — BEACON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-mark">◉</div>
            <div class="brand-text">
                <div class="brand-name">BEACON</div>
                <div class="brand-sub">Field Terminal</div>
            </div>
        </div>
        <nav class="topnav">
            <a href="index.html">Dashboard</a>
            <a href="terminal.html">Terminal</a>
            <a href="discovery.html">Discovery</a>
            <a href="alerts.html">Alerts</a>
            <a href="plugins.html">Plugins</a>
            <a href="widgets.html">Widgets</a>
            <a href="settings.html">Settings</a>
            <button class="button2 danger" id="logoutBtn">Logout</button>
        </nav>
    </header>
    <main>
        <div class="card">
            <div class="section-title">Beacon Terminal</div>
            <p class="mono" style="font-size:10px;color:var(--ink-dim);margin-bottom:12px;letter-spacing:.06em">TYPE HELP FOR COMMANDS · PING / DEVICES / CLEAR</p>
            <div class="terminal-container">
                <div id="terminal"></div>
                <input type="text" id="commandInput" placeholder="Enter command (ping &lt;ip&gt;, help)" autofocus>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', () => { document.cookie = 'dashboard_session=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;'; location.reload(); });

        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('commandInput');

        function printLine(message, className = '') {
            const div = document.createElement('div');
            const span = document.createElement('span');
            span.textContent = message;
            if (className) span.className = className;
            div.appendChild(span);
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function printPrompt() {
            printLine('beacon@field:~$ ', 'prompt');
        }

        async function executeCommand(command) {
            const parts = command.trim().split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            switch (cmd) {
                case '':
                    break;
                case 'help':
                    printLine('Available commands:');
                    printLine('  ping <ip>     - Ping a device');
                    printLine('  devices       - List all devices');
                    printLine('  clear         - Clear terminal');
                    printLine('  help          - Show this help');
                    break;
                case 'clear':
                    terminal.innerHTML = '';
                    printPrompt();
                    break;
                case 'ping':
                    if (!args[0]) {
                        printLine('Usage: ping <ip>', 'output-error');
                        break;
                    }
                    const ip = args[0];
                    printLine(`Pinging ${ip}…`);
                    try {
                        const response = await fetch('/ping', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ host: ip, timeout: 5000 }),
                            credentials: 'include'
                        });
                        const result = await response.json();
                        if (result.alive) {
                            printLine(`Reply from ${ip}: alive, latency=${result.latencyMs || '?'}ms`, 'output-success');
                        } else {
                            printLine(`Request timed out for ${ip}`, 'output-error');
                        }
                    } catch (error) {
                        printLine(`Error: ${error.message}`, 'output-error');
                    }
                    break;
                case 'devices':
                    try {
                        const response = await fetch('/devices', { credentials: 'include' });
                        if (response.ok) {
                            const devices = await response.json();
                            if (devices.length === 0) {
                                printLine('No devices configured.', 'output-error');
                            } else {
                                printLine('Configured devices:');
                                devices.forEach(d => {
                                    printLine(`  ${d.name} (${d.ip}) [${d.type || 'unknown'}]`, 'output-success');
                                });
                            }
                        } else {
                            printLine('Error loading devices', 'output-error');
                        }
                    } catch (error) {
                        printLine(`Error: ${error.message}`, 'output-error');
                    }
                    break;
                default:
                    printLine(`Unknown command: ${cmd}`, 'output-error');
                    printLine('Type "help" for available commands.');
            }
            printPrompt();
        }

        commandInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const command = commandInput.value;
                commandInput.value = '';
                
                printLine('> ' + command, 'muted');
                await executeCommand(command);
            }
        });

        printLine('BEACON Field Terminal — v1.1');
        printLine('Type "help" for available commands.');
        printPrompt();
        commandInput.focus();
    </script>
</body>
</html>
