<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><span class="brand-name">BEACON</span></header>
<main style="max-width:700px;margin:0 auto">
<div class="card onboard-step active" id="step1"><div style="text-align:center;padding:14px 0"><h2 style="margin:0 0 8px;font-size:16px;text-transform:uppercase">BEACON</h2><p style="color:var(--dim);font-size:12px" class="mono">ping / HTTP / SNMP monitor</p></div>
<div class="feature-grid"><div class="feature-card"><h4>Monitor</h4><p>Live status via WebSocket.</p></div><div class="feature-card"><h4>Alert</h4><p>Discord, Telegram, email, webhook.</p></div><div class="feature-card"><h4>Discover</h4><p>Auto-scan subnet.</p></div><div class="feature-card"><h4>Extend</h4><p>Custom plugins via ZIP.</p></div></div>
<div class="onboard-nav"><span></span><button class="button1" onclick="goStep(2)">Start →</button></div></div>
<div class="card onboard-step" id="step2"><div style="max-width:400px"><input type="password" id="onboardPassword" placeholder="Password"><input type="password" id="onboardPasswordConfirm" placeholder="Confirm"><p id="onboardPassStatus" class="status-message"></p></div>
<div class="onboard-nav"><button class="button2" onclick="goStep(1)">←</button><button class="button1" id="onboardSetPass">Set</button></div></div>
<div class="card onboard-step" id="step3"><div style="max-width:400px"><input type="text" id="onboardDeviceName" placeholder="Name"><input type="text" id="onboardDeviceIP" placeholder="IP">
<select id="onboardDeviceType"><option value="router">Router</option><option value="switch">Switch</option><option value="server">Server</option><option value="camera">Camera</option><option value="pc">PC</option><option value="printer">Printer</option></select>
<button class="button2" id="onboardTestDevice" style="margin-top:12px">Test</button><p id="onboardTestResult" class="mono" style="font-size:11px;margin-top:8px"></p></div>
<div class="onboard-nav"><button class="button2" onclick="goStep(2)">←</button><div style="display:flex;gap:8px"><button class="button2" onclick="goStep(4)">Skip</button><button class="button1" id="onboardAddDevice">Add</button></div></div></div>
<div class="card onboard-step" id="step4"><div style="text-align:center;padding:20px 0"><h2 style="margin:0 0 10px;font-size:16px;text-transform:uppercase;color:var(--acc)">Ready</h2>
<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px"><a href="index.html" class="button1" style="text-decoration:none">Dashboard</a><a href="alerts.html" class="button2" style="text-decoration:none">Alerts</a><a href="discovery.html" class="button2" style="text-decoration:none">Scan</a><a href="settings.html" class="button2" style="text-decoration:none">Settings</a></div></div></div>
<div class="step-dots"><div class="step-dot active" id="dot1"></div><div class="step-dot" id="dot2"></div><div class="step-dot" id="dot3"></div><div class="step-dot" id="dot4"></div></div>
</main>
<script src="js/site.js"></script><script src="js/onboarding.js"></script></body></html>
