<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="color-scheme" content="dark"><title>BEACON</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><span class="brand-name">BEACON</span>
<nav class="topnav"><a href="index.html">Dashboard</a><a href="terminal.html">Terminal</a><a href="discovery.html">Discovery</a><a href="alerts.html">Alerts</a><a href="plugins.html">Plugins</a><a href="widgets.html">Widgets</a><a href="settings.html">Settings</a><button class="button2 danger" id="logoutBtn">Logout</button></nav></header>
<main>
<div class="card"><div class="form-row">
<div class="form-group small"><select id="channelType"><option value="webhook">Webhook</option><option value="discord">Discord</option><option value="telegram">Telegram</option><option value="email">Email</option></select></div>
<div class="form-group"><input type="text" id="channelName" placeholder="Name"></div>
<div id="channelFields" style="flex:2;min-width:250px;display:flex;gap:8px;flex-wrap:wrap"></div>
<div class="form-group small"><button class="button1" id="addChannelBtn" style="width:100%">+</button></div></div></div>
<div class="card"><div id="channelsList" class="mono muted" style="font-size:12px">Loading…</div></div>
<div class="card"><div id="alertLog" class="mono muted" style="max-height:400px;overflow-y:auto;font-size:11px">Loading…</div></div>
<div class="card"><div class="form-row">
<div class="form-group small"><select id="maintDevice"></select></div>
<div class="form-group"><input type="datetime-local" id="maintStart"></div>
<div class="form-group"><input type="datetime-local" id="maintEnd"></div>
<div class="form-group"><input type="text" id="maintNote" placeholder="Note"></div>
<div class="form-group small"><button class="button1" id="addMaintBtn" style="width:100%">+</button></div>
</div><div id="maintList" class="mono muted" style="margin-top:12px;font-size:11px"></div></div>
</main>
<script src="js/site.js"></script><script src="js/alerts.js"></script></body></html>
