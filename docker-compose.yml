services:
  beacon:
    build: .
    ports:
      - "3000:3000"
      - "3443:3443"
    volumes:
      - ./devices.db:/app/devices.db
      - ./devices.json:/app/devices.json
      - ./.env:/app/.env
      - ./certs:/app/certs
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
